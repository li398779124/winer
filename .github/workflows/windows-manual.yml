# Personal, unsigned Windows installer. No release or upstream signing credentials.
name: Windows Manual Build

on:
  workflow_dispatch:
  # Bootstrap the workflow without merging it into the default branch.
  push:
    branches: [codex/callout-title-windows-build]

permissions:
  contents: read

concurrency:
  group: windows-manual-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
  NODE_OPTIONS: --max_old_space_size=4096

jobs:
  windows:
    name: Windows x64 unsigned installer
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout the selected branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          shared-key: tauri-personal-windows-x64

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Tauri runs beforeBuildCommand to build and embed both frontend and client plugin.
      # Release is the default profile; only custom-protocol is enabled, never qa.
      - name: Build the unsigned NSIS installer
        run: >-
          pnpm tauri build
          --target x86_64-pc-windows-msvc
          --bundles nsis
          --config app/src-tauri/tauri.personal.conf.json
          --features custom-protocol
          --no-sign
          -- --locked

      - name: Collect the installer, notices and build information
        shell: pwsh
        env:
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_REF: ${{ github.ref }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)"
          }
          New-Item -ItemType Directory -Path 'dist-personal' | Out-Null
          Copy-Item $installers[0].FullName 'dist-personal/'
          Copy-Item 'LICENSE', 'THIRD_PARTY_NOTICES.md' 'dist-personal/'
          Copy-Item 'docs/windows-personal-build.md' 'dist-personal/README.md'
          Copy-Item 'docs/callout-settings.md' 'dist-personal/'
          Copy-Item 'docs/windows-personal-build.md' 'dist-personal/'
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          @(
            "winer $version (personal, unsigned, release build)"
            "Repository: $env:BUILD_REPOSITORY"
            "Ref: $env:BUILD_REF"
            "Commit: $env:BUILD_SHA"
            "Run: $env:BUILD_RUN"
            'Target: x86_64-pc-windows-msvc'
            'Cargo features: custom-protocol (no qa)'
            'WebView2: reuse installed runtime; download and install only when missing'
            'Updater endpoints: none; install future builds manually'
          ) | Set-Content 'dist-personal/BUILD-INFO.txt' -Encoding utf8
          $files = @(Get-ChildItem 'dist-personal' -File | Sort-Object Name)
          $checksums = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content 'dist-personal/SHA256SUMS' -Encoding utf8
          @(
            '## Windows personal build'
            "Commit: ``$env:BUILD_SHA``"
            'Download the **winer-windows-x64-unsigned** artifact below and extract it.'
            "Run **$($installers[0].Name)** to install, then launch **winer**."
            'Unsigned lightweight installer; reuses WebView2 or downloads it when missing. No automatic updates.'
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload the complete installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winer-windows-x64-unsigned
          path: dist-personal/
          if-no-files-found: error
          retention-days: 14
